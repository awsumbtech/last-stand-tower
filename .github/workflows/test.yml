name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: World and element tests
        run: |
          node tools/world-test.js
          node tools/elements-test.js
          node tools/flow-test.js
      - name: Backyard deterministic sim (committed sim-ab hashes)
        run: node tools/sim-check.js
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Card and world-card layout tests
        run: |
          python -m http.server 8765 > /tmp/lst-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html > /dev/null && break; sleep 0.2; done
          python tools/card-layout-test.py http://127.0.0.1:8765/index.html

  main-baseline:
    # The committed hashes must still be main's: rerun the same 4 configs on main 70bff8c
    # (git worktree, its own tools/sim.js) and diff against tools/sim-expected.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check out main 70bff8c into a worktree
        run: git worktree add --detach ../main-70bff8c 70bff8c
      - name: Backyard sims on main vs committed hashes
        run: node tools/sim-check.js --root ../main-70bff8c
