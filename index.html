<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070f" />
  <title>Last Stand Tower</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,8 88,30 88,70 50,92 12,70 12,30' fill='none' stroke='%2300f0ff' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD (shown while playing) -->
  <div id="hud" class="hidden">
    <div class="hud-row">
      <div class="hud-item">Wave <span id="hud-wave">1</span></div>
      <div class="hud-item coins">&#9679; <span id="hud-coins">0</span></div>
      <div class="hud-item">Score <span id="hud-score">0</span></div>
    </div>
    <div class="hp-bar"><div id="hud-hp-fill"></div><span id="hud-hp-text">100 / 100</span></div>
    <div class="hud-buttons">
      <button id="btn-speed" class="small">1x</button>
      <button id="btn-pause" class="small">&#10073;&#10073;</button>
    </div>
  </div>

  <!-- Start screen -->
  <div id="screen-start" class="screen">
    <h1>LAST STAND<br /><span>TOWER</span></h1>
    <p>Your tower fires on its own. Survive the waves, collect coins, and upgrade between rounds.</p>
    <button id="btn-start">Start</button>
    <p class="best">Best wave: <span id="start-best">0</span></p>
    <p class="hint">Space / P: pause &nbsp;·&nbsp; F: game speed</p>
  </div>

  <!-- Upgrade screen (between waves) -->
  <div id="screen-upgrade" class="screen hidden">
    <h2>Wave <span id="up-wave">1</span> cleared!</h2>
    <p class="coins-line">&#9679; <span id="up-coins">0</span> coins</p>
    <div id="upgrade-list"></div>
    <button id="btn-next">Next wave &#9654;</button>
  </div>

  <!-- Pause screen -->
  <div id="screen-pause" class="screen hidden">
    <h2>Paused</h2>
    <button id="btn-resume">Resume</button>
    <button id="btn-quit" class="secondary">Quit to menu</button>
  </div>

  <!-- Game over screen -->
  <div id="screen-gameover" class="screen hidden">
    <h2 class="danger">Tower destroyed</h2>
    <p>You reached wave <strong id="go-wave">1</strong></p>
    <p>Score <strong id="go-score">0</strong></p>
    <p class="best" id="go-best">Best wave: 0</p>
    <button id="btn-restart">Play again</button>
  </div>

  <script src="src/config.js"></script>
  <script src="src/utils.js"></script>
  <script src="src/upgrades.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/waves.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
