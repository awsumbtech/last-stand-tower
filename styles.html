<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#86cc5f" />
  <title>Art Styles · Last Stand Tower</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Last Stand" />
  <link rel="preload" href="fonts/Fredoka.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { overflow: auto; height: auto; min-height: 100%; touch-action: pan-y; }
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    header .title.small { font-size: clamp(24px, 6.5vw, 34px); }
    header a.btn { min-width: 0; font-size: 15px; padding: 6px 14px 8px; border-radius: 999px; box-shadow: 0 4px 0 var(--ink); text-decoration: none; white-space: nowrap; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tabs button { min-width: 0; padding: 10px 4px 12px; font-size: 17px; background: var(--cream); }
    .tabs button[aria-selected="true"] { background: var(--yellow); transform: translateY(-2px) rotate(-1.5deg); }
    .preview {
      position: relative;
      width: 100%;
      height: min(64vh, 620px);
      min-height: 300px;
      border: 5px solid var(--ink);
      border-radius: 26px;
      box-shadow: 0 8px 0 var(--ink);
      overflow: hidden;
      touch-action: pan-y; /* vertical scroll stays native; horizontal swipes switch styles */
    }
    .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .badge { position: absolute; left: 10px; top: 10px; }
    .swipe-hint { position: absolute; right: 10px; bottom: 10px; font-size: 13px !important; }
    .label { font-size: 18px; font-weight: 600; min-height: 2.6em; text-align: center; }
    .dots { display: flex; justify-content: center; gap: 8px; }
    .dots span { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); transition: transform 0.2s var(--bouncy); }
    .dots span.on { background: var(--yellow); transform: scale(1.3); }
    .actions { display: flex; justify-content: center; }
    .actions a { text-decoration: none; }
    .note { font-size: 14px; text-align: center; color: #3c2f4c; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h2 class="title small">Art styles</h2>
      <a class="btn secondary" href="./">&larr; Game</a>
    </header>

    <div class="tabs" role="tablist" id="tabs"></div>

    <div class="preview" id="preview">
      <canvas id="demo"></canvas>
      <div class="pill badge" id="badge"></div>
      <div class="pill swipe-hint">swipe &harr;</div>
    </div>
    <div class="dots" id="dots"></div>
    <p class="label" id="label"></p>

    <div class="actions">
      <a id="play-link" class="btn" href="./">Play in this style</a>
    </div>
    <p class="note">Same scene, three looks. The game now uses <b>Cartoon</b>; Neon and Pixel stay here for comparison.</p>
  </div>

  <script src="src/config.js"></script>
  <script src="src/utils.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/sprites/SpriteAtlas.js"></script>
  <script src="src/sprites/SpriteLibrary.js"></script>
  <script src="src/sprites/AnimationPlayer.js"></script>
  <script src="src/sprites/SpriteTinter.js"></script>
  <script src="src/sprites/EyeLayer.js"></script>
  <script src="src/sprites/EnemyAnimationRules.js"></script>
  <script src="src/sprites/EnemySpriteRenderer.js"></script>
  <script src="src/themes/neon.js"></script>
  <script src="src/themes/pixel.js"></script>
  <script src="src/themes/cartoon.js"></script>
  <script src="src/demo.js"></script>
  <script src="src/pwa.js"></script>
  <script>
    (function () {
      const ORDER = ["neon", "pixel", "cartoon"];
      const canvas = document.getElementById("demo");
      const renderer = new LST.Renderer(canvas, LST.themes.cartoon);
      renderer.resize();
      const scene = new LST.DemoScene(renderer);
      window.demo = { scene, renderer };

      const tabs = document.getElementById("tabs");
      const dots = document.getElementById("dots");
      ORDER.forEach((id, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn";
        b.setAttribute("role", "tab");
        b.dataset.style = id;
        b.textContent = String.fromCharCode(97 + i) + ". " + LST.themes[id].name;
        b.addEventListener("click", () => select(id));
        tabs.appendChild(b);
        dots.appendChild(document.createElement("span"));
      });

      let current = 0;
      function select(id) {
        current = ORDER.indexOf(id);
        const theme = LST.themes[id];
        renderer.setTheme(theme);
        [...tabs.children].forEach((b) => b.setAttribute("aria-selected", b.dataset.style === id));
        [...dots.children].forEach((d, i) => d.classList.toggle("on", i === current));
        document.getElementById("badge").textContent = theme.name.toUpperCase();
        document.getElementById("label").textContent = theme.label;
        document.getElementById("play-link").href = id === "cartoon" ? "./" : "./?style=" + id;
        history.replaceState(null, "", "#" + id);
      }
      window.demo.select = select;

      // Horizontal swipe on the preview switches styles.
      const preview = document.getElementById("preview");
      let sx = 0, sy = 0, tracking = false;
      preview.addEventListener("touchstart", (e) => {
        tracking = true;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      preview.addEventListener("touchend", (e) => {
        if (!tracking) return;
        tracking = false;
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          const next = (current + (dx < 0 ? 1 : -1) + ORDER.length) % ORDER.length;
          select(ORDER[next]);
        }
      }, { passive: true });
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") select(ORDER[(current + 1) % ORDER.length]);
        if (e.key === "ArrowLeft") select(ORDER[(current + ORDER.length - 1) % ORDER.length]);
      });

      window.addEventListener("resize", () => renderer.resize());
      const initial = location.hash.slice(1);
      select(ORDER.includes(initial) ? initial : "cartoon");

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(LST.CONFIG.MAX_DT, (now - last) / 1000);
        last = now;
        scene.update(dt);
        renderer.draw(scene, dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
